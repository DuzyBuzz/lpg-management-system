    <section class="dashboard-page__kpi-grid">
      @for (card of varianceSummaryCards(); track card.label) {
        <app-summary-card [card]="card"></app-summary-card>
      }
    </section>

    <p-card styleClass="dashboard-page__card dashboard-page__table-card border border-white/70 shadow-sm">
      <div class="flex h-full min-h-0 flex-col gap-5">
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <p class="section-kicker">Variance Table</p>
            <h2 class="text-2xl font-bold tracking-tight text-slate-950">Variance watchlist</h2>
          </div>
          <p-tag severity="warn" [value]="workspace.highVarianceLabel()"></p-tag>
        </div>

        <div class="dashboard-page__table-region rounded-3xl border border-slate-200/80 bg-white">
          <p-table
            styleClass="report-table report-table--scroll"
            [value]="workspace.varianceTableRows()"
            [scrollable]="true"
            scrollHeight="flex"
            [paginator]="true"
            [rows]="10"
            [rowsPerPageOptions]="[10, 15, 20]"
            [rowTrackBy]="trackByVarianceId"
            sortField="variance"
            [sortOrder]="-1"
          >
            <ng-template pTemplate="header">
              <tr>
                <th pSortableColumn="accountName">Account Name <p-sortIcon field="accountName"></p-sortIcon></th>
                <th pSortableColumn="variance">Variance <p-sortIcon field="variance"></p-sortIcon></th>
                <th pSortableColumn="quantity">Quantity <p-sortIcon field="quantity"></p-sortIcon></th>
                <th pSortableColumn="total">Total <p-sortIcon field="total"></p-sortIcon></th>
              </tr>
            </ng-template>

            <ng-template pTemplate="body" let-row>
              <tr [ngClass]="row.rowClass">
                <td class="font-semibold text-slate-900">{{ row.accountName }}</td>
                <td>
                  <p-tag [severity]="row.varianceSeverity" [value]="row.varianceLabel"></p-tag>
                </td>
                <td>{{ row.quantityLabel }}</td>
                <td>{{ row.totalLabel }}</td>
              </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
              <tr>
                <td colspan="4" class="px-6 py-10 text-center text-sm text-slate-500">
                  No variance rows are available for the selected period.
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      </div>
    </p-card>
  </div>
</div>
