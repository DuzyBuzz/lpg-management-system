<p-card styleClass="summary-card h-full border border-white/70 shadow-sm">
  <div class="summary-card__shell">
    <div class="summary-card__top">
      <div class="summary-card__copy">
        <p class="summary-card__label">{{ card().label }}</p>
        <div class="summary-card__value">{{ card().value }}</div>
      </div>

      <div class="summary-card__icon-wrap">
        <div class="summary-card__icon" [ngClass]="card().accentClass">
          <i [class]="card().icon"></i>
        </div>
      </div>
    </div>

    <p class="summary-card__helper">{{ card().helperText }}</p>

    <div class="summary-card__footer">
      <p-tag [severity]="card().severity" [value]="card().tagLabel"></p-tag>
    </div>
  </div>
</p-card>
